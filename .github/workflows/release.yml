name: ODYSSEY Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python modules
        run: |
          python -m compileall -q \
            MissionComputer \
            Navigation \
            Control \
            Core \
            Communication \
            Sensors \
            Telemetry \
            Utils

      - name: Run release validation tests
        run: |
          python -m pytest -v

      - name: Package tagged source
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"

          git archive \
            --format=tar.gz \
            --prefix="ODYSSEY-UAV-${VERSION}/" \
            "${GITHUB_REF_NAME}" \
            -o "dist/ODYSSEY-UAV-${VERSION}.tar.gz"

          git archive \
            --format=zip \
            --prefix="ODYSSEY-UAV-${VERSION}/" \
            "${GITHUB_REF_NAME}" \
            -o "dist/ODYSSEY-UAV-${VERSION}.zip"

          cd dist
          sha256sum \
            "ODYSSEY-UAV-${VERSION}.tar.gz" \
            "ODYSSEY-UAV-${VERSION}.zip" \
            > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/ODYSSEY-UAV-"${GITHUB_REF_NAME}".tar.gz \
            dist/ODYSSEY-UAV-"${GITHUB_REF_NAME}".zip \
            dist/SHA256SUMS.txt \
            --title "ODYSSEY ${GITHUB_REF_NAME}" \
            --generate-notes
